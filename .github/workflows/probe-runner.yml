name: Probe Runner

# Workflow sementara untuk mengintrospeksi lingkungan self-hosted runner.
# Dihapus setelah data cukup untuk menyusun ci.yml/deploy.yml.
on:
  push:
  workflow_dispatch:

jobs:
  probe:
    name: Probe environment
    runs-on: [self-hosted, eult]
    steps:
      - name: System
        run: |
          echo "== uname =="; uname -a || true
          echo "== os-release =="; cat /etc/os-release || true
          echo "== whoami =="; whoami; id || true
          echo "== pwd =="; pwd
          echo "== HOME =="; echo "$HOME"
          echo "== disk =="; df -h / || true
          echo "== mem =="; free -h || true
          echo "== cpu =="; nproc || true

      - name: Runner env
        run: |
          echo "== runner vars =="; env | grep -iE '^(RUNNER|GITHUB_WORKSPACE|ACTIONS_)' | sort || true
          echo "== sudo =="; sudo -n true 2>/dev/null && echo "SUDO_NOPASSWD_OK" || echo "SUDO_UNAVAILABLE"
          echo "== docker =="; docker --version 2>/dev/null || echo "no docker"

      - name: PHP
        run: |
          echo "== which php =="; which -a php || true
          echo "== php -v =="; php -v || true
          echo "== php -m =="; php -m || true
          echo "== php ini =="; php --ini || true
          echo "== /etc/php =="; ls -1 /etc/php 2>/dev/null || true
          echo "== alternatives =="; update-alternatives --list php 2>/dev/null || true
          echo "== php-fpm service =="; systemctl list-units --type=service --state=running 2>/dev/null | grep -iE 'php|nginx|apache|mysql|maria' || true

      - name: Tooling
        run: |
          echo "== composer =="; which -a composer; composer --version 2>&1 | head -3 || true
          echo "== git =="; git --version || true
          echo "== rsync =="; rsync --version 2>/dev/null | head -1 || echo "no rsync"
          echo "== unzip =="; unzip -v 2>/dev/null | head -1 || echo "no unzip"
          echo "== curl =="; curl --version 2>/dev/null | head -1 || echo "no curl"

      - name: Web server
        run: |
          echo "== nginx =="; nginx -v 2>&1 || true
          echo "== nginx sites =="; ls -1 /etc/nginx/sites-enabled 2>/dev/null || true
          echo "== apache =="; apache2 -v 2>/dev/null | head -2 || true
          echo "== /var/www =="; ls -la /var/www 2>/dev/null || true

      - name: Existing deployment
        run: |
          echo "== spark files =="; find / -maxdepth 5 -name spark -type f -not -path '*/vendor/*' 2>/dev/null | head -20 || true
          echo "== eult dirs =="; ls -la /var/www/*eult* /opt/*eult* /srv/*eult* 2>/dev/null || true

      - name: Database
        run: |
          echo "== mysql =="; mysql --version 2>/dev/null || echo "no mysql client"
          echo "== mysql service =="; systemctl is-active mysql 2>/dev/null || systemctl is-active mariadb 2>/dev/null || echo "unknown"
