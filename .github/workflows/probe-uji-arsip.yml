name: Probe Uji Arsip

# Probe sementara (READ-ONLY): uji perintah eult:arsip memakai kode BRANCH
# di workspace runner, dengan .env produksi (disalin sementara, lalu dihapus).
# Hanya --dry-run dan --csv ke /tmp. Tidak menghapus data apa pun.
on:
  push:
  workflow_dispatch:

jobs:
  uji:
    name: Uji eult:arsip
    runs-on: [self-hosted, eult]
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan .env sementara
        run: |
          cp /home/eultunmul/apps/eult/.env "$GITHUB_WORKSPACE/.env"
          chmod 600 "$GITHUB_WORKSPACE/.env"
          echo "== .env disalin, kunci DB terdeteksi: =="
          grep -cE '^EULT_DB_' "$GITHUB_WORKSPACE/.env"

      - name: Perintah terdaftar
        run: |
          cd "$GITHUB_WORKSPACE"
          php spark list 2>&1 | grep -E 'eult:' || echo "(tidak ada)"

      - name: Dry-run ringkasan
        run: |
          cd "$GITHUB_WORKSPACE"
          php spark eult:arsip --dry-run 2>&1 | head -45

      - name: Ekspor CSV
        run: |
          cd "$GITHUB_WORKSPACE"
          php spark eult:arsip --csv=/tmp/kandidat-arsip.csv --semua 2>&1 | tail -6
          echo "== jumlah baris CSV =="
          wc -l /tmp/kandidat-arsip.csv 2>/dev/null || echo "(tidak ada CSV)"
          echo "== 4 baris pertama =="
          head -4 /tmp/kandidat-arsip.csv 2>/dev/null || true

      - name: Pastikan data tidak berubah
        run: |
          cd "$GITHUB_WORKSPACE"
          get() {
            local v
            v=$(grep -E "^$1[[:space:]]*=" .env | head -1 | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]+$//')
            v=${v%\"}; v=${v#\"}; v=${v%\'}; v=${v#\'}
            printf '%s' "$v"
          }
          H=$(get EULT_DB_HOST); U=$(get EULT_DB_USER)
          P=$(get EULT_DB_PASS); D=$(get EULT_DB_NAME)
          mysql -h "$H" -u "$U" -p"$P" -D "$D" -e \
            "SELECT COUNT(*) AS total_tiket FROM d_ticketing;" 2>&1

      - name: Bersihkan
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/.env" /tmp/kandidat-arsip.csv
          echo "== .env di workspace setelah dibersihkan =="
          ls -la "$GITHUB_WORKSPACE/.env" 2>/dev/null || echo "(sudah tidak ada)"
