name: Rehearsal Deploy

# Latihan deploy ke SALINAN direktori produksi, bukan produksi asli.
# Jalankan manual dari tab Actions sebelum rilis berisiko. Memvalidasi backup,
# rsync, cache clear, health check, DAN rollback.
on:
  workflow_dispatch:

env:
  SIM: /home/eultunmul/apps/eult-rehearsal
  SIM_BACKUP: /home/eultunmul/apps/eult-rehearsal-backups

jobs:
  rehearsal:
    name: Deploy rehearsal
    runs-on: [self-hosted, eult]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Info disk
        run: |
          echo "== df / =="; df -h / | tail -1
          echo "== df /tmp =="; df -h /tmp | tail -1
          echo "== df /home =="; df -h /home | tail -1
          echo "== ukuran produksi =="; du -sh /home/eultunmul/apps/eult 2>/dev/null

      - name: Siapkan salinan produksi
        run: |
          rm -rf "$SIM" "$SIM_BACKUP"
          # Lewati file sesi (ribuan, tidak relevan untuk uji) tetapi tetap
          # salin writable/session/index.html yang di-track git — kalau tidak,
          # git status di salinan akan melaporkan file terhapus.
          rsync -a \
            --include='writable/session/index.html' \
            --exclude='writable/session/*' \
            /home/eultunmul/apps/eult/ "$SIM"/
          test -f "$SIM/.env" || { echo "::error::.env tidak tersalin"; exit 1; }
          echo "Salinan siap:"; du -sh "$SIM"

      - name: Build dependensi produksi
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Dry run (preflight saja)
        run: |
          DEPLOY_PATH="$SIM" DEPLOY_BACKUP_DIR="$SIM_BACKUP" DEPLOY_DRY_RUN=true \
          bash .github/scripts/deploy.sh

      - name: Deploy sungguhan ke salinan
        run: |
          DEPLOY_PATH="$SIM" DEPLOY_BACKUP_DIR="$SIM_BACKUP" DEPLOY_DRY_RUN=false \
          bash .github/scripts/deploy.sh

      - name: Verifikasi hasil
        run: |
          echo "== backup terbentuk =="
          ls -la "$SIM_BACKUP"/
          echo "== .env masih utuh =="
          test -f "$SIM/.env" && echo "ENV_OK" || { echo "::error::.env hilang"; exit 1; }
          echo "== writable masih ada =="
          test -d "$SIM/writable/logs" && echo "WRITABLE_OK" || { echo "::error::writable hilang"; exit 1; }
          echo "== kode aplikasi tersinkron =="
          test -f "$SIM/app/Controllers/Ticketing.php" && echo "APP_OK" || { echo "::error::kode tidak tersinkron"; exit 1; }
          echo "== paket produksi ada =="
          test -d "$SIM/vendor/mpdf/mpdf" && echo "VENDOR_PROD_OK" || { echo "::error::vendor produksi hilang"; exit 1; }
          echo "== ukuran akhir =="; du -sh "$SIM"

      - name: Verifikasi metadata git produksi
        run: |
          echo "== HEAD produksi =="
          git -C "$SIM" log --oneline -1
          echo "== HEAD workspace =="
          git -C "$GITHUB_WORKSPACE" log --oneline -1
          echo "== git status produksi (harus bersih) =="
          git -C "$SIM" status --porcelain
          if [ -n "$(git -C "$SIM" status --porcelain)" ]; then
            echo "::error::git status produksi TIDAK bersih"
            exit 1
          fi
          echo "GIT_STATUS_BERSIH"
          echo "== .env & writable tidak dianggap perubahan =="
          git -C "$SIM" check-ignore -q .env && echo "ENV_IGNORED_OK" || echo "ENV_TIDAK_IGNORED"
          git -C "$SIM" check-ignore -q writable/logs && echo "WRITABLE_IGNORED_OK" || echo "WRITABLE_TIDAK_IGNORED"

      - name: Uji jalur sukses penuh (health check nyata)
        run: |
          # Health check ke nginx sungguhan, lalu smoke test `php spark routes`.
          DEPLOY_PATH="$SIM" DEPLOY_BACKUP_DIR="$SIM_BACKUP" \
          DEPLOY_HEALTHCHECK_URL=http://192.168.55.105/ \
          DEPLOY_HEALTHCHECK_HOST=eult.unmul.ac.id \
          DEPLOY_DRY_RUN=false \
          bash .github/scripts/deploy.sh

      - name: Uji rollback
        run: |
          echo "RUSAK" > "$SIM/app/Controllers/Ticketing.php"
          set +e
          DEPLOY_PATH="$SIM" DEPLOY_BACKUP_DIR="$SIM_BACKUP" \
          DEPLOY_HEALTHCHECK_URL=http://127.0.0.1:1/ \
          DEPLOY_DRY_RUN=false \
          bash .github/scripts/deploy.sh
          rc=$?
          set -e
          echo "exit code: $rc (diharapkan != 0)"
          test "$rc" -ne 0 || { echo "::error::deploy seharusnya gagal"; exit 1; }
          echo "== apakah kode dipulihkan? =="
          head -1 "$SIM/app/Controllers/Ticketing.php"
          grep -q RUSAK "$SIM/app/Controllers/Ticketing.php" \
            && { echo "::error::rollback TIDAK memulihkan kode"; exit 1; } \
            || echo "ROLLBACK_OK"

      - name: Bersihkan
        if: always()
        run: rm -rf "$SIM" "$SIM_BACKUP"
