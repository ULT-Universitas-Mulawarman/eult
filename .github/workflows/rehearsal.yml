name: Rehearsal Deploy

# Latihan deploy ke SALINAN direktori produksi (/tmp), bukan produksi asli.
# Tujuan: memvalidasi backup, rsync, cache clear, health check, dan rollback
# sebelum workflow Deploy menyentuh /home/eultunmul/apps/eult.
on:
  push:
  workflow_dispatch:

jobs:
  rehearsal:
    name: Deploy rehearsal
    runs-on: [self-hosted, eult]
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan salinan produksi
        run: |
          rm -rf /tmp/eult-deploy-sim /tmp/eult-backups-sim
          cp -a /home/eultunmul/apps/eult /tmp/eult-deploy-sim
          echo "Salinan dibuat:"
          ls -la /tmp/eult-deploy-sim | head -8
          test -f /tmp/eult-deploy-sim/.env && echo "ENV_ADA" || { echo "::error::.env tidak tersalin"; exit 1; }

      - name: Build dependensi produksi
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Dry run (preflight saja)
        run: |
          DEPLOY_PATH=/tmp/eult-deploy-sim \
          DEPLOY_BACKUP_DIR=/tmp/eult-backups-sim \
          DEPLOY_DRY_RUN=true \
          bash .github/scripts/deploy.sh

      - name: Deploy sungguhan ke salinan
        run: |
          DEPLOY_PATH=/tmp/eult-deploy-sim \
          DEPLOY_BACKUP_DIR=/tmp/eult-backups-sim \
          DEPLOY_DRY_RUN=false \
          bash .github/scripts/deploy.sh

      - name: Verifikasi hasil
        run: |
          echo "== backup terbentuk =="
          ls -la /tmp/eult-backups-sim/
          echo "== .env masih utuh =="
          test -f /tmp/eult-deploy-sim/.env && echo "ENV_OK" || { echo "::error::.env hilang"; exit 1; }
          echo "== writable masih ada =="
          test -d /tmp/eult-deploy-sim/writable/logs && echo "WRITABLE_OK" || { echo "::error::writable hilang"; exit 1; }
          echo "== kode tersinkron =="
          test -f /tmp/eult-deploy-sim/.github/scripts/deploy.sh && echo "TIDAK_TERSINKRON (harusnya tidak ada)" || echo "GITHUB_EXCLUDED_OK"
          test -f /tmp/eult-deploy-sim/app/Controllers/Ticketing.php && echo "APP_OK"
          echo "== ukuran =="
          du -sh /tmp/eult-deploy-sim 2>/dev/null

      - name: Uji rollback
        run: |
          echo "== rusak kode dengan sengaja =="
          echo "RUSAK" > /tmp/eult-deploy-sim/app/Controllers/Ticketing.php
          echo "== jalankan deploy dengan health check yang pasti gagal =="
          set +e
          DEPLOY_PATH=/tmp/eult-deploy-sim \
          DEPLOY_BACKUP_DIR=/tmp/eult-backups-sim \
          DEPLOY_HEALTHCHECK_URL=http://127.0.0.1:1/ \
          DEPLOY_DRY_RUN=false \
          bash .github/scripts/deploy.sh
          rc=$?
          set -e
          echo "exit code: $rc (diharapkan != 0)"
          test "$rc" -ne 0 || { echo "::error::deploy seharusnya gagal"; exit 1; }
          echo "== apakah kode dipulihkan? =="
          head -1 /tmp/eult-deploy-sim/app/Controllers/Ticketing.php
          grep -q RUSAK /tmp/eult-deploy-sim/app/Controllers/Ticketing.php \
            && { echo "::error::rollback TIDAK memulihkan kode"; exit 1; } \
            || echo "ROLLBACK_OK"

      - name: Bersihkan
        if: always()
        run: rm -rf /tmp/eult-deploy-sim /tmp/eult-backups-sim
